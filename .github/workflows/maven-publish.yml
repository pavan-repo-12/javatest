# This workflow will build a package using Maven and then publish it to GitHub packages when a release is created
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Java CI-CD Self Hosted

on:
  workflow_call:
    inputs:
      envvalue:
        required: true
        type: string
env:
  IMAGE_NAME: java

jobs:

  build-unittest:
    runs-on: self-hosted
    environment: ${{inputs.envvalue}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build with Maven
        run: mvn clean package

      - name: upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  build-dockerimage:
    runs-on: self-hosted
    needs: build-unittest
    environment: ${{inputs.envvalue}}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4    

      - name: Build Docker Image
        run: |
          eval $(minikube docker-env)
          IMAGE_TAG=${GITHUB_RUN_NUMBER}
          IMAGE_NAME=java:$IMAGE_TAG
          docker build -t $IMAGE_NAME .
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUBENV
      - name: Update Deployment YAML
        run: |
          IMAGE_NAME=java:${GITHUB_RUN_NUMBER}
          YAML_FILE=k8s/deployment.yaml
          # Replace the image line in YAML
          #sed -i "s|image:.*|image: $IMAGE_NAME|g" k8s/deployment.yaml
          sed -i "s|tag:.*|tag: $IMAGE_TAG |g" javatest-chart/${{vars.HELMVALUES}}.yaml

        
      - name: Commit & Push YAML
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add javatest-chart/${{vars.HELMVALUES}}.yaml
          git commit -m "Update deployment image to $IMAGE_NAME [ci skip]" || echo "No changes to commit"
          git push origin feature/javahelm

  deploy-k8s:
    runs-on: self-hosted
    needs: build-dockerimage
    environment: ${{inputs.envvalue}}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4  
      - name: Apply helm charts
        run: |
          helm upgrade --install ${{vars.CHARTNAME}} ./javatest-chart   -f javatest-chart/${{vars.HELMVALUES}}.yaml 
          


